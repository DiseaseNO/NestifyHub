name: TestFlight

# Kjører kun på main og tags. Viktig for et OFFENTLIG repo: pull requests fra fremmede
# forks får aldri tilgang til secrets, og skal heller ikke kunne laste opp noe.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Kjører FØRST og stopper alt hvis noe som avslører nettverket har sneket seg inn.
  # Repoet er offentlig, og kodekommentarer skrives fortløpende — dette er en maskinsjekk
  # i stedet for en huskeregel.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hygienesjekk.sh

  build:
    needs: hygiene
    # Laster IKKE opp ved hver push. Vi bygger mange ganger i timen under designarbeid,
    # og Apple struper opplastinger per app. Simulator-jobben under kjører fortsatt alltid,
    # så skjermbilder og kompilering sjekkes uansett — bare TestFlight venter til vi ber om det.
    # Utløses av `workflow_dispatch` eller en tag (`git tag v1.2 && git push --tags`).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Apple krever at apper bygges med et SDK som ikke er for gammelt. Runner-bildet
      # har flere Xcode-versjoner installert; vi tar den nyeste framfor standardvalget,
      # som ga «This app was built with the iOS 18.5 SDK».
      - name: Velg nyeste Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NYESTE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "velger $NYESTE"
          sudo xcode-select -s "$NYESTE"
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer Xcode-prosjektet
        run: xcodegen generate
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Navnet under ikonet. Må være unikt på App Store (ITMS-90129), derfor
          # en secret framfor hardkodet verdi — da kan det byttes uten kodeendring.
          DISPLAY_NAME: ${{ secrets.DISPLAY_NAME || 'Nestify Hub' }}

      # xcodebuild leter etter nøkkelen i ~/.appstoreconnect/private_keys, med filnavn
      # AuthKey_<KEYID>.p8. Uten den kan ikke -allowProvisioningUpdates snakke med Apple.
      - name: Legg App Store Connect-nøkkelen der Xcode finner den
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

      - name: Bygg og last opp til TestFlight
        run: bundle exec fastlane beta || fastlane beta
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

  # Kjører appen i simulator og laster opp skjermbilder som artefakter. Uten dette bygger
  # vi blindt: koden kan kompilere feilfritt og likevel krasje ved oppstart eller se helt
  # gal ut. Skjermbildene hentes ned og inspiseres (scripts/gh_skjerm.py i smarthus-repoet).
  simulator:
    needs: hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Velg nyeste Xcode
        run: |
          NYESTE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NYESTE"
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer Xcode-prosjektet
        run: xcodegen generate
        env:
          # BEVISST uten DEVELOPMENT_TEAM: simulator-jobben skal ikke snakke med Apple.
          # Med team satt provisjonerte Xcode automatisk og lagde et nytt
          # utviklingssertifikat per kjøring, til kvoten var full.
          DEVELOPMENT_TEAM: ""
          BUILD_NUMBER: ${{ github.run_number }}
          # Navnet under ikonet. Må være unikt på App Store (ITMS-90129), derfor
          # en secret framfor hardkodet verdi — da kan det byttes uten kodeendring.
          DISPLAY_NAME: ${{ secrets.DISPLAY_NAME || 'Nestify Hub' }}

      # Loggen skrives til fil og vi plukker ut FEILENE hvis bygget ryker. Sto med
      # `| tail -30` før, og da forsvant kompilatorfeilene i byggekommandoens eget
      # etterspill — man så at det feilet, ikke hvorfor.
      - name: Bygg for simulator
        run: |
          if ! xcodebuild build \
            -project NestifyHub.xcodeproj \
            -scheme NestifyHub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual > bygg.log 2>&1; then
              echo "::group::kompilatorfeil"
              grep -E "error:" bygg.log | sed 's|.*/Sources/|Sources/|' | sort -u | head -40
              echo "::endgroup::"
              tail -25 bygg.log
              exit 1
          fi
          tail -3 bygg.log

      # Runneren står i USA og slipper ikke gjennom brannmuren hjemme — TCP-connect
      # timer ut. Derfor tar vi dataene MED inn i kjøringen: et ferskt, komprimert
      # øyeblikksbilde av de ekte svarene ligger i `CI_DATA`, og serveres lokalt over
      # TLS. Appen ser altså virkelige tall, uten at noe må åpnes utenfra.
      # Byggeserveren står i utlandet og har hittil ikke sluppet gjennom brannmuren
      # hjemme. Vi prøver den ekte veien først med kort tålmodighet — den dagen den
      # åpnes, bytter kjøringen over av seg selv og bruker live data. Svarer den ikke,
      # faller vi tilbake på øyeblikksbildet, og ingenting stopper opp.
      - name: Svarer hjemmeserveren?
        env:
          CI_VERT: ${{ secrets.CI_VERT }}
        run: |
          if [ -n "$CI_VERT" ] && curl -s --max-time 10 "https://$CI_VERT/api/health" -o /dev/null; then
            echo "hjemmeserveren svarer — appen kjører mot live data"
            echo "HJEMME=1" >> "$GITHUB_ENV"
          else
            echo "ingen vei hjem — faller tilbake på øyeblikksbildet"
            echo "HJEMME=" >> "$GITHUB_ENV"
          fi

      - name: Legg ut datasettet lokalt
        env:
          CI_DATA: ${{ secrets.CI_DATA }}
        run: |
          [ -z "$HJEMME" ] || { echo "hopper over — vi bruker den ekte serveren"; exit 0; }
          # `secrets` kan ikke brukes i en `if:`-betingelse, så sjekken må stå her.
          [ -n "$CI_DATA" ] || { echo "::warning::CI_DATA mangler — appen får ingen data"; exit 0; }
          printf '%s' "$CI_DATA" | base64 --decode | gunzip > ci-data.json
          python3 -c "import json;d=json.load(open('ci-data.json'));print('datasett:', ', '.join(d))"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ci-nokkel.pem -out ci-cert.pem \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null
          python3 scripts/ci_stubbe.py ci-data.json 8443 ci-cert.pem ci-nokkel.pem &
          for i in $(seq 1 20); do
            curl -ks https://localhost:8443/api/health >/dev/null && break
            sleep 1
          done
          echo "stubbe oppe"

      # Uten dette bygger vi blindt: koden kan kompilere feilfritt og likevel krasje ved
      # oppstart eller se helt gal ut. Simulatoren pares med en egen enhet på hjemmeserveren
      # (rolle `ci`: kan LESE fpl-data og legge fra seg skjermbilder, ingenting mer), og
      # startes én gang per skjerm med `-skjerm` — enklere og mer robust enn å simulere trykk.
      - name: Kjør appen i simulator
        env:
          CI_VERT: ${{ secrets.CI_VERT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -o pipefail
          # Velg en tilgjengelig iPhone uten å hardkode modellnavn — runner-bildene
          # bytter modeller mellom Xcode-versjoner.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print([x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']][0])")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" dd/Build/Products/Debug-iphonesimulator/NestifyHub.app
          # Simulatoren må stole på stubbens sertifikat; appen snakker bare https.
          [ -f ci-cert.pem ] && xcrun simctl keychain "$UDID" add-root-cert ci-cert.pem

          # $1 = filnavn, resten = oppstartsargumenter til appen
          knips() {
            navn="$1"; shift
            xcrun simctl terminate "$UDID" no.gustavs1.hjemme 2>/dev/null || true
            xcrun simctl launch "$UDID" no.gustavs1.hjemme "$@" >/dev/null
            # Vent til appen ER i forgrunnen. Uten dette traff skjermbildet hjemskjermen,
            # fordi oppstarten ikke var ferdig.
            for i in $(seq 1 20); do
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q hjemme && break
              sleep 1
            done
            sleep 6
            xcrun simctl io "$UDID" screenshot "$navn.png"
          }

          knips 1-paring
          if [ -n "$HJEMME" ]; then
            VERT="$CI_VERT"; TOKEN="$CI_TOKEN"
          elif [ -f ci-data.json ]; then
            VERT=localhost:8443; TOKEN=ci
          else
            echo "::warning::verken vei hjem eller datasett — bare paringsskjermen er knipset"
          fi
          if [ -n "${VERT:-}" ]; then
            knips 2-moduler   -server "$VERT" -token "$TOKEN"
            for skjerm in naa beslutning historikk helse; do
              knips "3-$skjerm" -server "$VERT" -token "$TOKEN" -skjerm "$skjerm"
            done
            # Spillerdetaljene krever et trykk i appen; flagget åpner dem ved oppstart.
            knips 4-spiller -server "$VERT" -token "$TOKEN" -skjerm naa -spillerdetalj 1
          fi

          xcrun simctl spawn "$UDID" log show --style compact --last 5m \
            --predicate 'processImagePath CONTAINS "NestifyHub"' > app-konsoll.txt 2>&1 || true
          echo "--- siste linjer fra appen ---"
          tail -25 app-konsoll.txt || true

      # Best er at bildene aldri havner på GitHub. Når veien hjem finnes, sendes de dit
      # og forlater ikke huset. Se `backend/src/ci.ts` i smarthus-repoet.
      - name: Send skjermbildene hjem
        if: always()
        env:
          CI_VERT: ${{ secrets.CI_VERT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$HJEMME" ] || { echo "ingen vei hjem — bildene krypteres i stedet"; exit 0; }
          send() {
            curl -sS --max-time 30 -X POST \
              -H "Authorization: Bearer $CI_TOKEN" \
              -H "X-CI-Kjoring: ${{ github.run_number }}" \
              -H "Content-Type: $2" --data-binary "@$1" \
              "https://$CI_VERT/api/kamera/ci-skjerm/$1" \
              -o /dev/null -w "  $1 -> %{http_code}\n" || echo "  $1 FEILET"
          }
          for f in *.png; do [ -e "$f" ] && send "$f" image/png; done
          [ -e app-konsoll.txt ] && send app-konsoll.txt text/plain
          true

      # Faller vi tilbake på artefakt, må bildene krypteres: repoet er offentlig, og
      # artefakter der er åpne for alle. Nøkkelen finnes bare i Vault.
      - name: Krypter og last opp skjermbildene
        if: always()
        env:
          NOKKEL: ${{ secrets.CI_ARTEFAKT_NOKKEL }}
        run: |
          [ -z "$HJEMME" ] || { echo "bildene er allerede sendt hjem"; exit 0; }
          [ -n "$NOKKEL" ] || { echo "::warning::CI_ARTEFAKT_NOKKEL mangler — laster ikke opp"; exit 0; }
          tar czf skjermbilder.tar.gz *.png app-konsoll.txt 2>/dev/null || tar czf skjermbilder.tar.gz *.png
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in skjermbilder.tar.gz -out skjermbilder.enc -pass env:NOKKEL
          ls -l skjermbilder.enc

      - name: Last opp
        if: always() && env.HJEMME == ''
        uses: actions/upload-artifact@v4
        with:
          name: skjermbilder
          path: skjermbilder.enc
          retention-days: 7
